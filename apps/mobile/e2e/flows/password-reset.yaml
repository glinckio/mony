appId: com.mony.app
---
# Exercises the forgot-password -> reset-password screens end to end
# against the real API. Can't assert the happy path all the way through
# (the 6-digit code is emailed via Brevo / logged server-side in dev —
# Maestro has no way to read either from here, see tasks.md's note on
# this gap), so this asserts the generic "check your email" confirmation
# after requesting a code, then that a wrong code is rejected on confirm
# — both hit the real endpoints and prove the screens and API are wired
# correctly end to end.
- launchApp
- evalScript: ${output.testEmail = 'maestro-reset-' + Date.now() + '@example.com'}
- assertVisible: "Entrar"
- tapOn: "Não tem uma conta? Criar conta"
- assertVisible: "Criar sua conta"
- tapOn:
    id: "name-input"
- inputText: "Maestro Reset Tester"
- tapOn:
    id: "email-input"
- inputText: "${output.testEmail}"
- tapOn:
    id: "password-input"
- inputText: "correcthorsebattery"
- tapOn:
    id: "password-confirmation-input"
- inputText: "correcthorsebattery"
- tapOn:
    id: "submit-button"
- assertVisible: "Bem-vindo, Maestro Reset Tester"
- tapOn:
    id: "logout-button"
- assertVisible: "Entrar"
- tapOn: "Esqueceu sua senha?"
- assertVisible: "Esqueceu sua senha?"
- tapOn:
    id: "email-input"
- inputText: "${output.testEmail}"
- tapOn:
    id: "submit-button"
- assertVisible: "Se este e-mail estiver cadastrado, você receberá um código em instantes."
- tapOn:
    id: "go-to-reset"
- assertVisible: "Redefinir senha"
- tapOn:
    id: "code-input"
- inputText: "000000"
- tapOn:
    id: "new-password-input"
- inputText: "brandNewPassword1"
- tapOn:
    id: "new-password-confirmation-input"
- inputText: "brandNewPassword1"
- tapOn:
    id: "submit-button"
- assertVisible: "Código inválido ou expirado."
