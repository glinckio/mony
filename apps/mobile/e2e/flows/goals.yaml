appId: com.mony.app
---
# Registers a fresh account, creates a goal, updates its progress, then
# marks it completed — exercises the Goals list + form screens against
# the real API.
- launchApp
- evalScript: ${output.testEmail = 'maestro-goals-' + Date.now() + '@example.com'}
- assertVisible: "Entrar"
- tapOn: "Não tem uma conta? Criar conta"
- assertVisible: "Criar sua conta"
- tapOn:
    id: "name-input"
- inputText: "Maestro Goals Tester"
- tapOn:
    id: "email-input"
- inputText: "${output.testEmail}"
- tapOn:
    id: "password-input"
- inputText: "correcthorsebattery"
- tapOn:
    id: "password-confirmation-input"
- inputText: "correcthorsebattery"
- tapOn:
    id: "submit-button"
- assertVisible: "Bem-vindo, Maestro Goals Tester"

# A category to optionally attach to the goal below.
- tapOn:
    id: "go-to-categories"
- tapOn:
    id: "add-category-button"
- tapOn:
    id: "name-input"
- inputText: "Viagens"
- tapOn:
    id: "icon-picker-airplane-outline"
- tapOn:
    id: "submit-button"
- assertVisible: "Viagens"
- tapOn:
    id: "go-to-home"

- tapOn:
    id: "go-to-goals"
- assertVisible: "Nenhuma meta ainda."
- tapOn:
    id: "add-goal-button"
- tapOn:
    id: "title-input"
- inputText: "Viagem para a praia"
- tapOn:
    id: "target-amount-input"
- inputText: "500000"
- tapOn: "Viagens"
- tapOn:
    id: "submit-button"
- assertVisible: "Viagem para a praia"

- tapOn: "Viagem para a praia"
- assertVisible: "Editar meta"
- tapOn:
    id: "current-amount-input"
- inputText: "300000"
- tapOn:
    id: "submit-button"
- assertVisible: "60%"

- tapOn: "Viagem para a praia"
- tapOn:
    id: "completed-toggle"
- tapOn:
    id: "submit-button"
- assertVisible: "Concluídas"
