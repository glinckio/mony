appId: com.mony.app
---
# Registers a fresh account, creates a debt, pays one installment, checks
# the installment's linked expense shows up paid in Transações, then
# cancels the payment — exercises the Mais menu + Dívidas screens against
# the real API. The debt starts in 2099 so every installment is still in
# the future (nothing auto-paid, debt stays "Ativa") whatever day this runs.
- launchApp
- evalScript: ${output.testEmail = 'maestro-debts-' + Date.now() + '@example.com'}
- assertVisible: "Entrar"
- tapOn: "Não tem uma conta? Criar conta"
- assertVisible: "Criar sua conta"
- tapOn:
    id: "name-input"
- inputText: "Maestro Debts Tester"
- tapOn:
    id: "email-input"
- inputText: "${output.testEmail}"
- tapOn:
    id: "password-input"
- inputText: "correcthorsebattery"
- tapOn:
    id: "password-confirmation-input"
- inputText: "correcthorsebattery"
- tapOn:
    id: "submit-button"
- assertVisible: "Bem-vindo, Maestro Debts Tester"

# Every installment becomes an expense, so an expense category comes first.
- tapOn:
    id: "tab-more"
- tapOn:
    id: "more-categories"
- tapOn:
    id: "add-category-button"
- tapOn:
    id: "name-input"
- inputText: "Financiamentos"
- tapOn:
    id: "icon-picker-car-outline"
- tapOn:
    id: "submit-button"
- assertVisible: "Financiamentos"
- tapOn:
    id: "header-back"

- tapOn:
    id: "more-debts"
- assertVisible: "Nenhuma dívida ainda."
- tapOn:
    id: "add-debt-button"
- assertVisible: "Nova dívida"
- tapOn:
    id: "name-input"
- inputText: "Geladeira"
- tapOn:
    id: "total-amount-input"
- inputText: "300000"
- tapOn:
    id: "total-installments-input"
- inputText: "3"
# Regex, not a literal: Intl may put a non-breaking space after "R$".
- assertVisible: '3x de R.*1.000,00.*'
- tapOn:
    id: "start-date-input"
- inputText: "10012099"
- hideKeyboard
- tapOn:
    id: "submit-button"
- assertVisible: "Geladeira"
- assertVisible: "Ativas"

# Installments listed, pay the first one through the sheet's defaults.
- tapOn: "Geladeira"
- assertVisible: "0 de 3 parcelas pagas"
- assertVisible:
    id: "installment-row-1"
- assertVisible:
    id: "installment-row-3"
- tapOn:
    id: "pay-installment-1"
- assertVisible: "Pagar parcela 1"
- tapOn:
    id: "confirm-payment-button"
- assertVisible: "1 de 3 parcelas pagas"
- assertVisible:
    id: "cancel-payment-1"

# The installment's linked expense is now paid in Transações.
- tapOn:
    id: "header-back"
- tapOn:
    id: "header-back"
- tapOn:
    id: "tab-transactions"
- tapOn:
    id: "search-input"
- inputText: "Geladeira"
- assertVisible: "Parcela 1/3 - Geladeira"
- assertVisible: "Parcela 3/3 - Geladeira"
- assertVisible: "Marcar como pendente"

# Undo the payment from the debt screen.
- tapOn:
    id: "tab-more"
- tapOn:
    id: "more-debts"
- tapOn: "Geladeira"
- tapOn:
    id: "cancel-payment-1"
- tapOn: "Sim, desfazer"
- assertVisible: "0 de 3 parcelas pagas"
- assertVisible:
    id: "pay-installment-1"
