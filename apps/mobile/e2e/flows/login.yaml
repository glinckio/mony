appId: com.mony.app
---
# Registers a fresh account, logs out, then logs back in with the same
# credentials — exercises the full register -> logout -> login loop,
# including the auth stack redirect on logout. Uses evalScript (not
# inputRandomEmail) so the same generated address can be reused for the
# later login step.
- launchApp
- evalScript: ${output.testEmail = 'maestro-login-' + Date.now() + '@example.com'}
- assertVisible: "Entrar"
- tapOn: "Não tem uma conta? Criar conta"
- assertVisible: "Criar sua conta"
- tapOn:
    id: "name-input"
- inputText: "Maestro Login Tester"
- tapOn:
    id: "email-input"
- inputText: "${output.testEmail}"
- tapOn:
    id: "password-input"
- inputText: "correcthorsebattery"
- tapOn:
    id: "password-confirmation-input"
- inputText: "correcthorsebattery"
- tapOn:
    id: "submit-button"
- assertVisible: "Bem-vindo, Maestro Login Tester"
- tapOn:
    id: "logout-button"
- assertVisible: "Entrar"
- tapOn:
    id: "email-input"
- inputText: "${output.testEmail}"
- tapOn:
    id: "password-input"
- inputText: "correcthorsebattery"
- tapOn:
    id: "submit-button"
- assertVisible: "Bem-vindo, Maestro Login Tester"
